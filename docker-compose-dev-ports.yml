# Dev override: publish infra ports to the host so natively-run Django/Vite
# can reach them. Usage:
#   docker compose -f docker-compose.yml -f docker-compose-dev-ports.yml up -d --no-deps plane-db plane-redis plane-mq plane-minio
services:
  plane-db:
    ports:
      - "5432:5432"
  plane-redis:
    ports:
      - "6379:6379"
  plane-mq:
    ports:
      - "5672:5672"
      - "15672:15672"
  plane-minio:
    ports:
      - "9000:9000"
